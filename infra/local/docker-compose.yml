services:
  db:
    image: postgres:15
    container_name: pg_resolveja
    restart: unless-stopped
    ports:
      - 5445:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal-network
    volumes:
      - postgres_data_resolveja:/var/lib/postgresql/data
    env_file:
      - .env.local

volumes:
  postgres_data_resolveja:

networks:
  internal-network:
    driver: bridge